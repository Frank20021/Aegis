[project]
name = "aegis"
version = "0.1.0"
description = "Control plane for the Aegis sandboxed multi-agent runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agents = ["ray>=2.40", "dspy>=2.6"]

[project.scripts]
aegis-ctl = "aegis.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
