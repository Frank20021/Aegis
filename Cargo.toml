[workspace]
resolver = "2"
members = [
    "crates/aegis-shm",
    "crates/aegis-seccomp",
    "crates/aegis-sandbox",
    "crates/aegis-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
crc32fast = "1.5"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
# Cranelift + pooling allocator, without the component model. Fuel and epoch
# interruption live in the runtime feature.
wasmtime = { version = "50", default-features = false, features = [
    "anyhow",
    "cranelift",
    "gc",
    "gc-null",
    "parallel-compilation",
    "pooling-allocator",
    "runtime",
    "std",
    "wat",
] }
